spring.application.name=faltometro

spring.datasource.url=jdbc:mysql://localhost:3306/faltometro?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

api.security.token.secret=faltometro-chave-secreta-do-grupo
